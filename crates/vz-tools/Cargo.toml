[package]
name = "vz-tools"
version = "1.0.0"
edition = "2024"
description = "vz-tools: CLI utilities (vz) for creating, inspecting, verifying, repairing, appending, and compacting .vz containers"
license = "MIT OR Apache-2.0"

[[bin]]
name = "vz"
path = "src/main.rs"

[dependencies]
libvz = { path = "../libvz", features = ["cli"] }
clap = { version = "4.6", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27"
